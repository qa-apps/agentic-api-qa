[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-api-qa"
version = "0.1.0"
description = "A minimal LangGraph-orchestrated framework for API quality assurance."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27,<1",
    "langgraph>=0.2.60,<2",
    "langsmith>=0.1.147,<1",
    "pydantic>=2.9,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
agentic-api-qa = "agentic_api_qa.runner:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]
dev = [
    "langgraph-cli[inmem]>=0.4.31,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_api_qa"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
