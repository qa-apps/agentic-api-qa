name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install package with test extras
        run: python -m pip install -e '.[test]'

      - name: Run tests
        run: pytest

      - name: Verify the sample report still matches the report schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from agentic_api_qa.models import FinalReport

          path = Path("reports/sample-report.json")
          FinalReport.model_validate(json.loads(path.read_text(encoding="utf-8")))
          print(f"{path} validates against FinalReport")
          PY
