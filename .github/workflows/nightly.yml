name: Nightly scan

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override API_BASE_URL"
        required: false
        type: string
      environment:
        description: "Target environment safety profile"
        required: false
        type: choice
        options:
          - production
          - staging
          - local
        default: production
  schedule:
    # 3:00 AM America/New_York. Both UTC slots cover daylight-saving time;
    # the gate below starts only the matching slot.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"

permissions:
  # gh-pages: each run publishes its full HTML report under runs/<run number>/.
  contents: write

concurrency:
  group: nightly-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schedule-gate:
    name: Select the matching schedule slot
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Evaluate scheduled run window
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub often starts scheduled runs late, so decide by which cron
          # fired rather than by the current hour.
          ny_tz="$(TZ=America/New_York date +%Z)"
          case "${{ github.event.schedule }}|$ny_tz" in
            "0 7 * * *|EDT"|"0 8 * * *|EST") should_run=true ;;
            *) should_run=false ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  scan:
    name: Agentic scan
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE_URL: ${{ inputs.base_url || 'https://www.alexpavsky.com' }}
      QA_ENVIRONMENT: ${{ inputs.environment || 'production' }}
      QA_PRODUCTION_READ_ONLY: "true"
      QA_REQUIRE_MUTATION_APPROVAL: "true"
      LANGSMITH_PROJECT: agentic-api-qa
      # A chat turn waits on an upstream LLM, so the 10s default expires against
      # a healthy endpoint and is recorded as a failed happy path.
      API_TIMEOUT_SECONDS: "30"
      # An exhausted budget is a blocking pipeline error by design — a run that
      # was cut short must not be able to report PASS. So the ceiling has to be
      # high enough for both agents to decide to finish on their own.
      QA_EXPLORER_ITERATIONS: "8"
      QA_ADVERSARY_ITERATIONS: "8"
      QA_EXPLORER_TOOL_CALLS: "12"
      QA_ADVERSARY_TOOL_CALLS: "12"
      QA_TOTAL_TOOL_CALLS: "24"
      # The Healer opens fix PRs, so it stays in its manual-only workflow.
      QA_HEALER_ENABLED: "false"
      QA_REPORT_SERVER_ENABLED: "false"
      LANGFUSE_TRACING_ENABLED: ${{ secrets.LANGFUSE_PUBLIC_KEY != '' }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: https://us.cloud.langfuse.com
      # #alexpavsky-daily-audit, shared with the Playwright reporters for the site.
      QA_SLACK_SUMMARY_CHANNEL_ID: C0BPQTUS2DR
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check for agent credentials
        id: creds
        shell: bash
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          if [ -n "$ZAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ZAI_API_KEY is not configured; the live scan is skipped and this run stays green."
          fi

      - name: Setup Python
        if: steps.creds.outputs.present == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install package
        if: steps.creds.outputs.present == 'true'
        run: python -m pip install -e .

      - name: Run the agentic scan
        id: scan
        if: steps.creds.outputs.present == 'true'
        continue-on-error: true
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY != '' }}
        run: agentic-api-qa --output "reports/nightly-${GITHUB_RUN_ID}.json"

      - name: Upload the JSON report
        if: always() && steps.creds.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-report-${{ github.run_number }}
          path: |
            reports/nightly-*.json
            reports/nightly-*.html
            reports/videos/
          if-no-files-found: warn
          retention-days: 30

      - name: Build the full report page
        id: site
        if: always() && steps.creds.outputs.present == 'true'
        shell: bash
        run: |
          report=$(ls -1 reports/nightly-*.html 2>/dev/null | head -1 || true)
          if [ -z "$report" ]; then
            echo "The scan produced no HTML report to publish."
            exit 0
          fi
          dest="site/runs/${GITHUB_RUN_NUMBER}"
          mkdir -p "$dest"
          cp "$report" "$dest/index.html"
          cp "${report%.html}.json" "$dest/report.json"
          if [ -d reports/videos ]; then cp -R reports/videos "$dest/"; fi
          # The site root always opens the latest run.
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=runs/%s/"><title>AP Agents report</title><a href="runs/%s/">Latest AP Agents report</a>\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" > site/index.html
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Publish the full report to GitHub Pages
        id: publish
        if: always() && steps.site.outputs.ready == 'true'
        # Reporting, not verification: a failed publish must not change the
        # verdict. Slack then links the GitHub run only.
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: true
          enable_jekyll: false
          commit_message: "AP agents report: run #${{ github.run_number }}"

      - name: Post the run summary to Slack
        if: always() && steps.creds.outputs.present == 'true'
        continue-on-error: true
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          REPORT_PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report=$(ls -1 reports/nightly-*.json 2>/dev/null | head -1 || true)
          if [ -z "$report" ]; then
            echo "The scan produced no report; nothing to summarize."
            exit 0
          fi
          report_url=""
          if [ "$REPORT_PUBLISHED" = "true" ]; then
            owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
            report_url="https://${owner_lc}.github.io/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_NUMBER}/"
            # Pages deploys shortly after the push; wait so the Slack button
            # works on the first click.
            for attempt in $(seq 1 30); do
              curl --fail --silent --output /dev/null "$report_url" && break
              sleep 5
            done
          fi
          python -m agentic_api_qa.slack_summary \
            --report "$report" \
            --channel "$QA_SLACK_SUMMARY_CHANNEL_ID" \
            --report-url "$report_url" \
            --run-url "$RUN_URL"

      - name: Summarize the verdict
        if: always() && steps.creds.outputs.present == 'true'
        shell: bash
        run: |
          report=$(ls -1 reports/nightly-*.json 2>/dev/null | head -1 || true)
          if [ -z "$report" ]; then
            echo "The scan produced no report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - "$report" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys

          report = json.loads(open(sys.argv[1], encoding="utf-8").read())
          run = report["run"]
          metrics = report["metrics"]
          print(f"## Verdict: {run['overall_result']}")
          print()
          print(f"- Target: `{run['target']}` ({run['environment']})")
          print(f"- Duration: {run['duration_ms']:.0f} ms")
          print(f"- Happy path: {metrics['happy_path_passed']} passed, {metrics['happy_path_failed']} failed")
          print(
              f"- Guardrails: {metrics['guardrails_held']} held, "
              f"{metrics['guardrails_breached']} breached, "
              f"{metrics['guardrails_inconclusive']} inconclusive"
          )
          print(f"- Tool calls: {metrics['total_tool_calls']}")
          print()
          print(report["summary"])
          PY

      - name: Fail the run on a non-PASS verdict
        if: steps.creds.outputs.present == 'true' && steps.scan.outcome == 'failure'
        run: |
          echo "::error::The agentic scan returned a non-PASS verdict."
          exit 1
