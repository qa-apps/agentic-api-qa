name: Nightly scan

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override API_BASE_URL"
        required: false
        type: string
      environment:
        description: "Target environment safety profile"
        required: false
        type: choice
        options:
          - production
          - staging
          - local
        default: production
  schedule:
    # 3:00 AM America/New_York. Both UTC slots cover daylight-saving time;
    # the gate below starts only the matching slot.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: nightly-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schedule-gate:
    name: Select the matching schedule slot
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Evaluate scheduled run window
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub often starts scheduled runs late, so decide by which cron
          # fired rather than by the current hour.
          ny_tz="$(TZ=America/New_York date +%Z)"
          case "${{ github.event.schedule }}|$ny_tz" in
            "0 7 * * *|EDT"|"0 8 * * *|EST") should_run=true ;;
            *) should_run=false ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  scan:
    name: Agentic scan
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE_URL: ${{ inputs.base_url || 'https://www.alexpavsky.com' }}
      QA_ENVIRONMENT: ${{ inputs.environment || 'production' }}
      QA_PRODUCTION_READ_ONLY: "true"
      QA_REQUIRE_MUTATION_APPROVAL: "true"
      LANGSMITH_PROJECT: agentic-api-qa
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check for agent credentials
        id: creds
        shell: bash
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          if [ -n "$ZAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ZAI_API_KEY is not configured; the live scan is skipped and this run stays green."
          fi

      - name: Setup Python
        if: steps.creds.outputs.present == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install package
        if: steps.creds.outputs.present == 'true'
        run: python -m pip install -e .

      - name: Run the agentic scan
        id: scan
        if: steps.creds.outputs.present == 'true'
        continue-on-error: true
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY != '' }}
        run: agentic-api-qa --output "reports/nightly-${GITHUB_RUN_ID}.json"

      - name: Upload the JSON report
        if: always() && steps.creds.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-report-${{ github.run_number }}
          path: reports/nightly-*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize the verdict
        if: always() && steps.creds.outputs.present == 'true'
        shell: bash
        run: |
          report=$(ls -1 reports/nightly-*.json 2>/dev/null | head -1 || true)
          if [ -z "$report" ]; then
            echo "The scan produced no report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - "$report" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys

          report = json.loads(open(sys.argv[1], encoding="utf-8").read())
          run = report["run"]
          metrics = report["metrics"]
          print(f"## Verdict: {run['overall_result']}")
          print()
          print(f"- Target: `{run['target']}` ({run['environment']})")
          print(f"- Duration: {run['duration_ms']:.0f} ms")
          print(f"- Happy path: {metrics['happy_path_passed']} passed, {metrics['happy_path_failed']} failed")
          print(
              f"- Guardrails: {metrics['guardrails_held']} held, "
              f"{metrics['guardrails_breached']} breached, "
              f"{metrics['guardrails_inconclusive']} inconclusive"
          )
          print(f"- Tool calls: {metrics['total_tool_calls']}")
          print()
          print(report["summary"])
          PY

      - name: Fail the run on a non-PASS verdict
        if: steps.creds.outputs.present == 'true' && steps.scan.outcome == 'failure'
        run: |
          echo "::error::The agentic scan returned a non-PASS verdict."
          exit 1
